[project]
name = "smartbizlq"
version = "1.1.0"
description = "Self-service business analytics: KPI dashboards, forecasting, churn modelling and scenario planning"
requires-python = ">=3.10"

[tool.ruff]
line-length = 130
extend-exclude = ["SmartBizLQ_streamlit_app.py", "_original", "legacy"]

[tool.ruff.lint]
select = ["E9", "F", "W6", "B006", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
